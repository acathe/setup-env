# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/refs/heads/master/schema/config.json

gui:
  nerdFontsVersion: "3"
  filterMode: fuzzy

git:
  diffRenderers:
    - command: >-
        delta --paging=never --features=side-by-side --hyperlinks
        --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
      name: delta-side-by-side

    - command: >-
        delta --paging=never --features=unified --hyperlinks
        --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
      name: delta-unified
